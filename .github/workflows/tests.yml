name: Tests

on:
  push:
    branches:
      - master
      - feature/*
  pull_request:
    branches:
      - master

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -v

  coverage:
    runs-on: ubuntu-latest
    permissions:
      # python-coverage-comment-action stores badge data in the
      # python-coverage-comment-action-data branch and comments on PRs
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run tests with coverage
        run: pytest --cov=yatracker
      - name: Coverage comment and badge
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  pytest-next:
    # Early warning for the upcoming Python release; does not block CI.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -v
