name: Linters

on:
  push:
    branches:
      - master
      - feature/*
  pull_request:
    branches:
      - master

# Least-privilege default for every job; jobs that need more
# declare their own permissions block.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version is pinned to match .pre-commit-config.yaml so CI,
      # pre-commit and local runs agree on the rule set
      - uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.5'
          args: 'check'
          src: './yatracker'

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: jpetrucciani/mypy-check@master
        with:
          path: './yatracker'
          mypy_flags: '--config-file pyproject.toml'
          requirements: pydantic
