site_name: YaTracker
repo_url: https://github.com/Olegt0rr/YaTracker
repo_name: Olegt0rr/YaTracker
nav:
  - О библиотеке: index.md
  - С чего начать: howto.md
  - Работа с API:
    - Задачи: issues.md
    - Очереди: queues.md
    - Компоненты: components.md
    - Проекты (устаревший API): projects.md
    - Проекты, портфели и цели: entities.md
    - Макросы: macros.md
    - Доски и спринты: boards.md
    - Комментарии: comments.md
    - Чек-листы: checklists.md
    - Учёт времени: worklogs.md
    - Прикреплённые файлы: attachments.md
    - Массовые операции: bulk_changes.md
    - Импорт: import.md
    - Внешние приложения: applications.md
    - Пользователи: users.md
    - Администрирование: admin.md
    - Поля задач: issue_fields.md
    - Права доступа очередей: queue_access.md
    - Рабочие процессы: workflows.md
    - Триггеры: triggers.md
    - Автодействия: autoactions.md
    - Комментарии сущностей: entity_comments.md
    - Файлы сущностей: entity_attachments.md
    - Чек-листы сущностей: entity_checklists.md
    - Связи сущностей: entity_links.md
    - Доступ к сущностям: entity_access.md
    - Отчёты по задачам: reports.md
    - Фильтры: filters.md
    - Отсутствия: gaps.md
    - Дашборды: dashboards.md
  - Обработка ошибок: errors.md
  - Дополнительные возможности:
    - Работа с пользовательскими полями: custom_fields.md


theme:
  name: material
  language: ru

  palette:
    primary: blue

  features:
    - content.code.copy
    - content.code.annotate

plugins:
  - mkdocstrings

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
